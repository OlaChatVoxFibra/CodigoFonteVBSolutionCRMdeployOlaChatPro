# railway.toml da PASTA ./backend (FALLBACK / COERÊNCIA).
# O arquivo principal de deploy é /railway.toml na RAIZ do repositório.
# Este existe apenas para retrocompatibilidade caso o Railway esteja apontando aqui.
#
# NOTA: o Dockerfile desta pasta foi reescrito para funcionar com AMBOS os contextos:
#   • build context = raiz do repositório  (padrão Railway ao conectar repo inteiro)
#   • build context = ./backend            (se Railway rootDirectory = backend)
# Em ambos os casos, o runtime cria symlink bidirecional /app ↔ /app/backend.

[build]
builder = "DOCKERFILE"
# Caminho RELATIVO ao rootDirectory configurado no Railway / build context.
dockerfilePath = "Dockerfile"

[deploy]
# startCommand COMENTADO (mesma regra do railway.toml da raiz).
# Prefira SEMPRE o CMD do Dockerfile (./scripts/docker-entrypoint.sh) que detecta layout.
# Se precisar customizar, use exatamente essa linha abaixo:
#   startCommand = "./scripts/docker-entrypoint.sh"
healthcheckPath = "/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
