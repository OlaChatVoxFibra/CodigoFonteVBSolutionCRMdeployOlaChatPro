# Configuração Railway (RAIZ DO REPO) para o backend OlaChat Pro CRM.
# Service: SERVIDOR BACKEND CRM.
# Builder = DOCKERFILE.
#
# ⚠️ startCommand EXPLÍCITO com CAMINHOS ABSOLUTOS (funciona em qualquer cwd):
#    Railway ignora CMD do Dockerfile quando startCommand está definido.
#    Executa start-production.js, que primeiro sobe FAILSAFE na porta 8080,
#    depois roda migrations e tenta subir o server full em background.
#    Com isso NUNCA MAIS teremos x-railway-fallback:true / Application not found.
#
# Layout simbionte: AMBOS os Dockerfiles montam /app e /app/backend como
# ponteiros simétricos (symlink bidirecional). Os dois caminhos abaixo são
# 100% equivalentes — usamos fallback duplo para 0 ambiguidade.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'if [ -d /app/backend ]; then cd /app/backend; else cd /app; fi; node scripts/prepare-and-migrate.js 2>&1 || true; exec node dist/server.js'"
healthcheckPath = "/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
