<!DOCTYPE html>
<html lang="pt">
  <head>
    <title>OlaChat Pro</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/favicon.png">
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.png">
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="theme-color" content="#128C5A" />
    <meta
      name="viewport"
      content="minimum-scale=1, initial-scale=1, width=device-width, shrink-to-fit=no, user-scalable=no"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <style>
      /* Reset e configurações básicas */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow: hidden;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      
      html {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
      }

      /* Google Tradutor: barra e widget sempre ocultos — só nosso botão de idioma ativa */
      body > .skiptranslate:not(:has(#root)) {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        width: 0 !important;
        overflow: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
      iframe.goog-te-banner-frame,
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      .goog-te-gadget-icon,
      .skiptranslate.goog-te-gadget,
      #goog-gt-tt,
      .goog-te-balloon-frame,
      #google_translate_element,
      .goog-te-menu-value,
      .goog-te-gadget,
      .goog-te-gadget-simple,
      .goog-te-ftab,
      .goog-logo-link,
      .goog-te-gadget span {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        width: 0 !important;
        overflow: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
      html, body {
        top: 0 !important;
        margin-top: 0 !important;
        position: static !important;
      }
      .goog-text-highlight {
        background: none !important;
        box-shadow: none !important;
      }
      .translated-ltr, .translated-rtl {
        margin-top: 0 !important;
      }
    </style>

    <!-- Issue workaround for React v16. -->
    <script>
      // See https://github.com/facebook/react/issues/20829#issuecomment-802088260
      if (!crossOriginIsolated) SharedArrayBuffer = ArrayBuffer;
    </script>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("preferredTheme");
          var dark =
            t === "dark" ||
            (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.setAttribute("data-theme", dark ? "dark" : "light");
          if (dark) root.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
  </body>
</html>
